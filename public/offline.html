<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#f5f4ef" />
    <title>Nou · A quiet moment.</title>
    <meta name="robots" content="noindex, nofollow" />
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f4ef;
        --ink: #252922;
        --muted: #767b72;
      }
      html[data-theme="dark"] {
        color-scheme: dark;
        --bg: #141614;
        --ink: #eff1e8;
        --muted: #9ea497;
      }
      * {
        box-sizing: border-box;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        font-family: system-ui, sans-serif;
        padding: 30px;
        text-align: center;
      }
      svg {
        margin-bottom: 20px;
      }
      h1 {
        font-size: 38px;
        font-weight: 450;
        letter-spacing: -1.5px;
      }
      p {
        color: var(--muted);
        font-size: 14px;
        max-width: 320px;
        line-height: 1.8;
      }
      button {
        background: var(--ink);
        color: var(--bg);
        padding: 14px 28px;
        border: 0;
        border-radius: 28px;
        font: inherit;
        margin-top: 15px;
        cursor: pointer;
      }
      #saved {
        font-size: 24px;
        color: var(--ink);
      }
    </style>
    <script>
      try {
        var p = JSON.parse(localStorage.getItem("nou-theme") || '"auto"'),
          c = JSON.parse(localStorage.getItem("nou-theme-context") || "null"),
          n = Date.now(),
          h = new Date().getHours(),
          d = c ? n >= c.sunrise && n < c.sunset : h >= 7 && h < 19;
        if (p === "dark" || (p === "auto" && !d)) {
          document.documentElement.dataset.theme = "dark";
          document.querySelector('meta[name="theme-color"]').content = "#141614";
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <main>
      <svg width="46" height="46" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M6 25V15.5a10 10 0 0 1 20 0V25h-6V15.5a4 4 0 0 0-8 0V25H6Z" fill="currentColor" />
        <circle cx="16" cy="22.5" r="2" fill="currentColor" />
        <path
          d="M6 29h20"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
        />
      </svg>
      <h1>A quiet moment.</h1>
      <p>
        You’re offline. Your last saved reading is below. Fresh weather will be here when you
        reconnect.
      </p>
      <p id="saved"></p>
      <p id="updated"></p>
      <button onclick="location.reload()">Try again</button>
    </main>
    <script>
      try {
        var p = JSON.parse(localStorage.getItem("nou-place") || "null"),
          w = JSON.parse(localStorage.getItem("nou-weather-" + (p ? p.id : "london")) || "null"),
          u = JSON.parse(localStorage.getItem("nou-unit") || '"c"');
        if (w) {
          var t = w.current.temperature_2m;
          document.getElementById("saved").textContent =
            (p ? p.name : "London") +
            " · " +
            Math.round(u === "f" ? (t * 9) / 5 + 32 : t) +
            "°" +
            u.toUpperCase();
          document.getElementById("updated").textContent =
            "Saved reading · " +
            new Intl.DateTimeFormat("en-GB", {
              timeZone: w.timezone,
              dateStyle: "medium",
              timeStyle: "short",
            }).format(w.current.time * 1000);
        }
      } catch (e) {}
      window.addEventListener("online", function () {
        location.reload();
      });
    </script>
  </body>
</html>
